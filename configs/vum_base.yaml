model: 
  transport:
    P_mean: 0.8
    P_std: 0.8  
  scheduler: 
    target: vum.schedulers.hybrid_sched.HybridSchedule
    params:
      patch_size: 16
      base_resolution: 256
      T_max: 1.0
      T_min: 0.004
      mae_noise_max: 0.1
      mae_ratio: 0.25
      diff_ratio: 0.25
      mask_ratio_mae: 0.75
      mask_ratio_hybrid: [0.0, 0.75]
      hybrid_mask_style: linear
      mae1_coeff: 1.0
      mae2_coeff: 0.1
      norm_pix_loss: True
      target_noisy_pix: True
  network:  
    target: vum.models.vum.VUM
    params:
      in_channels: 3
      patch_size: 16
      bottleneck_dim: 128
      num_classes: 1000
      hidden_size: 768
      num_heads: 16
      n_blocks: 12
      decoder_hidden_size: 768
      num_decoder_heads: 16
      n_decoder_blocks: 12
      mlp_ratio: 4.0
      attn_drop: 0.0
      proj_drop: 0.0
      n_cls_tokens: 1
      n_reg_tokens: 0
      mask_grid: 1
      mae_ratio: 0.25
  # class doropout
  class_dropout_prob: 0.1
  
  

data:
  data_type: c2i_image
  dataset:
    image_dir: /path/to/imagenet/train
    image_size: 256
  dataloader:
    num_workers: 4
    batch_size: 128  # Batch size (per device) for the training dataloader.

  
training:
  engine_type: c2i
  compile_model: False
  gradient_checkpointing: False
  tracker: null
  max_train_steps: 100000
  checkpointing_steps: 10000
  ema_decay: 0.9999
  max_grad_norm: 1.0
  learning_rate: 1.0e-4
  learning_rate_base_batch_size: 1024
  optimizer: 
    target: muon
    weight_decay: 1.0e-2
  lr_scheduler: constant_with_warmup # "linear", "cosine", "cosine_with_restarts", "polynomial", "constant", "constant_with_warmup"
  lr_warmup_steps: 5000
  gradient_accumulation_steps: 1
  checkpoints_total_limit: 2
  resume_from_checkpoint: latest
  checkpoint_list: [25000, 50000, 75000]
  
      
